operation:
  id: map
  name: Column Map Hook
  version: "1.0"
  category: transform
  kind: hook
  description: 사용자가 작성한 변환 함수로 값의 나열을 다른 값의 나열로 바꿉니다.

input:
  representation: columnar
  format: elements
  min_bytes: 0

output:
  representation: columnar
  format: elements
  variable_size: true

parameters: {}

hook:
  symbol: isc_map
  signature: "U isc_map(T value)"
  returns: element
  output_element: declared
  element_types: [u8, u16, u32, u64, i8, i16, i32, i64, f32]
  template: logic.hpp.template
  staged_header: isc_user_logic.hpp
  input_description: "{in} 값(little-endian)이 이어진 파일"
  output_description: "변환된 {out} 값, 입력과 같은 개수"
  examples:
    int:
      - "return value * 3;"
      - "return value >> 2;"
      - "return value & 0xFF;"
    float:
      - "return value * 0.5f;"
      - "return value * 255.0f;"
      - "return value > 0.0f ? value : 0.0f;"

runtime:
  backend: xrt

kernel:
  name: isc_map_kernel
  source: kernel/map.cpp.tmpl
  include_dirs: []
  arguments:
    - {name: input, kind: buffer, direction: in}
    - {name: output, kind: buffer, direction: out}
    - {name: row_count, kind: scalar, direction: in}
  memory:
    - {port: m_axi_gmem0, bank: 0}
    - {port: m_axi_gmem1, bank: 1}

build:
  platform: xilinx_u50_gen3x16_xdma_5_202210_1
  memory_type: HBM
  targets: [hw_emu, hw]

validation:
  mode: cross_target
  reference_target: hw_emu

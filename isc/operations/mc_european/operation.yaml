operation:
  id: mc_european
  name: Monte Carlo European option pricing (Vitis Quantitative Finance)
  version: "1.1"
  category: finance
  description: >-
    유럽형 옵션 N건의 가격을 Vitis Quantitative Finance L2 MCEuropeanEngine 의 Monte Carlo 로
    계산합니다. 엔진에 넘기기 전 변동성을 정하는 사용자 함수 isc_volatility 를 넣을 수 있습니다.

input:
  representation: binary
  # u32 count, u32 reserved, f32 option[count][8] = S, K, sigma, q, r, T, type(0 콜, 1 풋), reserved
  format: isc_mc_options_f32
  min_bytes: 40

output:
  representation: binary
  # f32 price[count]
  format: isc_f32_vector
  variable_size: true

parameters:
  samples:
    type: integer
    scope: host
    description: 옵션 하나당 Monte Carlo 경로 수
    default: 4096
    minimum: 1024
    maximum: 1048576
  time_steps:
    type: integer
    scope: host
    description: 경로당 시간 단계 수
    default: 1
    minimum: 1
    maximum: 100

user_logic:
  template: logic.hpp.template
  staged_header: isc_user_logic.hpp
  functions:
    - symbol: isc_volatility
      signature: "float isc_volatility(float sigma)"
      when: "옵션마다 1번, 엔진에 넘기기 직전. 반환값이 엔진이 쓰는 변동성"

baseline:
  # Monte Carlo 는 근사값이라 해석해와 바이트가 같지 않다. 정확성 판정은 상대오차로 한다.
  equivalence: none
  description: Black-Scholes 해석해 (math.erf)

runtime:
  backend: xrt

kernel:
  name: isc_mc_european
  source: kernel/mc_european_kernel.cpp
  include_dirs:
    - ${VITIS_LIBRARIES}/quantitative_finance/L1/include
    - ${VITIS_LIBRARIES}/quantitative_finance/L2/include
  arguments:
    - {name: options, kind: buffer, direction: in}
    - {name: prices, kind: buffer, direction: out}
    - {name: count, kind: scalar, direction: in}
    - {name: samples, kind: scalar, direction: in}
    - {name: time_steps, kind: scalar, direction: in}
  memory:
    - {port: m_axi_gmem0, bank: 0}
    - {port: m_axi_gmem1, bank: 1}

build:
  platform: xilinx_u50_gen3x16_xdma_5_202210_1
  memory_type: HBM
  targets: [hw_emu, hw]

validation:
  mode: cross_target
  reference_target: hw_emu

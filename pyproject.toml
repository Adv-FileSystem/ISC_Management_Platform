[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "isc-platform"
version = "0.1.0"
description = "ISC module lifecycle platform: create -> build -> run -> validate -> record -> reuse"
requires-python = ">=3.10"
dependencies = ["PyYAML>=5.4"]

[project.scripts]
isc = "isc.cli:main"

[tool.setuptools.packages.find]
include = ["isc*"]

[tool.setuptools.package-data]
isc = ["operations/**/*"]
